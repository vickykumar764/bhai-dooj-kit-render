name: Render kit frames
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            range: "0-99"
            count: 100
          - shard: 1
            range: "100-199"
            count: 100
          - shard: 2
            range: "200-299"
            count: 100
          - shard: 3
            range: "300-399"
            count: 100
          - shard: 4
            range: "400-499"
            count: 100
          - shard: 5
            range: "500-599"
            count: 100
          - shard: 6
            range: "600-699"
            count: 100
          - shard: 7
            range: "700-799"
            count: 100
          - shard: 8
            range: "800-899"
            count: 100
          - shard: 9
            range: "900-999"
            count: 100
          - shard: 10
            range: "1000-1099"
            count: 100
          - shard: 11
            range: "1100-1199"
            count: 100
          - shard: 12
            range: "1200-1299"
            count: 100
          - shard: 13
            range: "1300-1399"
            count: 100
          - shard: 14
            range: "1400-1499"
            count: 100
          - shard: 15
            range: "1500-1599"
            count: 100
          - shard: 16
            range: "1600-1699"
            count: 100
          - shard: 17
            range: "1700-1799"
            count: 100
          - shard: 18
            range: "1800-1899"
            count: 100
          - shard: 19
            range: "1900-1985"
            count: 86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install playwright@1.65.0
      - name: Install three.js
        run: cd web && npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Render shard
        run: node render.mjs frames "${{ matrix.range }}"
      - name: Verify frame count
        run: |
          n=$(ls frames/*.jpg | wc -l)
          echo "rendered $n frames, expected ${{ matrix.count }}"
          test "$n" -eq "${{ matrix.count }}"
      - name: Upload frames
        uses: actions/upload-artifact@v4
        with:
          name: kit-frames-shard-${{ matrix.shard }}
          path: frames/
          if-no-files-found: error
          retention-days: 2
